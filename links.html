<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<script data-theme-init>(function(){try{var t=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Корисні посилання — Пісківський ліцей «Лідер»</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="description" content="Корисні посилання для учнів та батьків ліцею «Лідер» — освітні платформи, офіційні ресурси та сервіси." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Ліцей «Лідер» · Пісківка" />
<meta property="og:title" content="Корисні посилання — Пісківський ліцей «Лідер»" />
<meta property="og:description" content="Освітні платформи, офіційні ресурси та корисні сервіси для учнів і батьків ліцею." />
<meta property="og:image" content="https://www.litsey-lider.org/wp-content/uploads/2024/04/IMG_9113-1024x768.jpg" />
<meta property="og:locale" content="uk_UA" />
<meta name="twitter:card" content="summary_large_image" />
</head>
<body>

<div data-site-header data-page="links"></div>

<section class="page-hero">
  <div class="wrap">
    <a class="crumb" href="/">
      <svg viewBox="0 0 12 12" fill="none"><path d="M7 3L4 6l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      На головну
    </a>
    <h1>Корисні <span class="brush">посилання
      <svg viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
        <defs><filter id="rough-25"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="25"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs>
        <path d="M8 50 Q 60 18, 140 32 T 280 38 T 392 30 L 388 60 Q 300 76, 200 66 T 60 70 T 12 64 Z" fill="#E3C993" opacity="0.85" filter="url(#rough-25)"/>
      </svg>
    </span></h1>
    <p class="lede" data-text="links_lede">Освітні ресурси, офіційні сайти та платформи онлайн-навчання.</p>
  </div>
</section>


<section class="section">
  <div class="wrap">
    <div id="links-grid" class="grid-cards">
      <!-- заповнюється з content/links.json -->
    </div>
    <script>
      fetch('/content/links.json')
        .then(function(r){ return r.json(); })
        .then(function(data){
          var grid = document.getElementById('links-grid');
          if (!grid || !data.items) return;
          grid.innerHTML = data.items.map(function(link){
            return '<a class="info-card" href="' + link.url + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">' +
              '<h3>' + link.title + ' ↗</h3>' +
              '<p>' + link.description + '</p></a>';
          }).join('');
        })
        .catch(function(){});
    </script>
  </div>
</section>


<div data-site-footer></div>
<script src="site.js"></script>
</body>
</html>
