<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<script data-theme-init>(function(){try{var t=localStorage.getItem('theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Розклад — Пісківський ліцей «Лідер»</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="description" content="Тижневий розклад уроків та дзвінків Пісківського ліцею «Лідер» для 5–12 класів." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Ліцей «Лідер» · Пісківка" />
<meta property="og:title" content="Розклад — Пісківський ліцей «Лідер»" />
<meta property="og:description" content="Тижневий розклад уроків та дзвінків для учнів 5–12 класів. Оберіть свій клас." />
<meta property="og:image" content="/uploads/gallery-03.jpg" />
<meta property="og:locale" content="uk_UA" />
<meta name="twitter:card" content="summary_large_image" />
<style>
  .schedule-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: rgba(143,167,189,0.14);
    padding: 6px;
    border-radius: 999px;
    margin-bottom: 28px;
    width: max-content;
    max-width: 100%;
  }
  .schedule-tab {
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--teal-gray);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .schedule-tab:hover { background: rgba(255,255,255,0.5); }
  .schedule-tab.active { background: #fff; color: #0e1417; box-shadow: 0 1px 4px rgba(44,53,57,0.08); }

  .week-grid {
    display: grid;
    grid-template-columns: 80px repeat(5, 1fr);
    gap: 10px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 24px;
    box-shadow: var(--shadow-card);
    overflow-x: auto;
  }
  .week-grid .day-head {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: rgba(20,28,33,0.5);
    padding: 6px 8px;
    text-align: center;
  }
  .week-grid .day-head .dow { display: block; color: #0e1417; font-size: 15px; letter-spacing: -0.01em; text-transform: none; margin-top: 2px; font-weight: 700; }
  .week-grid .time-cell {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: rgba(20,28,33,0.55);
    padding: 14px 8px 0 0;
    text-align: right;
    line-height: 1.3;
  }
  .week-grid .time-cell strong { display: block; color: #0e1417; font-size: 13px; font-weight: 700; font-family: inherit; }
  .week-grid .slot {
    background: var(--slate-soft);
    border-radius: 14px;
    padding: 10px 12px;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }
  .week-grid .slot.gold { background: var(--gold-warm); }
  .week-grid .slot.empty { background: rgba(143,167,189,0.08); }
  .week-grid .slot .s-name { font-size: 13.5px; font-weight: 600; color: #0e1417; line-height: 1.2; }
  .week-grid .slot .s-room { font-size: 11px; color: rgba(20,28,33,0.55); margin-top: 2px; }

  .bells-section { padding: 56px 0 0; }
  .bells.standalone .bell { background: #fff; border: 1px solid var(--line); }
  .bells.standalone .bell.alt { background: var(--cream-2); border-color: transparent; }

  /* Live highlight */
  .bell--now { background: var(--gold-warm) !important; border-color: #e3c993 !important; position: relative; color: #1a1a1a !important; }
  .bell--now * { color: #1a1a1a !important; }
  .bell--now::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: #c9a84c; border-radius: 0 2px 2px 0; }
  .bell--break { background: rgba(227,201,147,0.18) !important; }
  .time-cell--now strong { color: #b8943e !important; }
  .slot--now { outline: 2.5px solid #e3c993; outline-offset: -2px; background: rgba(227,201,147,0.22) !important; }
  .day-head--today .dow { color: #b8943e !important; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #b8943e; background: rgba(227,201,147,0.22); border: 1px solid #e3c993; border-radius: 999px; padding: 4px 12px; margin-bottom: 16px; }
  .live-badge .dot { width: 6px; height: 6px; background: #b8943e; border-radius: 50%; animation: blink 1.4s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  @media (max-width: 980px) {
    .week-grid { grid-template-columns: 60px repeat(5, 1fr); gap: 6px; padding: 16px; min-width: 520px; }
    .week-grid .slot .s-room { display: none; }
  }

  /* ── Mobile day-by-day view ── */
  .day-switcher { display: none; }
  .mobile-list  { display: none; }

  @media (max-width: 640px) {
    /* class tabs: horizontal scroll, no wrap */
    .schedule-tabs { border-radius: 14px; flex-wrap: nowrap !important; overflow-x: auto; width: 100% !important; max-width: 100%; scrollbar-width: none; }
    .schedule-tabs::-webkit-scrollbar { display: none; }
    .schedule-tab { flex-shrink: 0; padding: 8px 14px; font-size: 13px; }

    /* hide week grid, show day view */
    .week-grid   { display: none !important; }
    .day-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-switcher::-webkit-scrollbar { display: none; }
    .day-btn {
      flex-shrink: 0;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      background: var(--slate-soft);
      color: var(--teal-gray);
      transition: background 140ms, color 140ms;
      position: relative;
    }
    .day-btn.today::after {
      content: '';
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b8943e;
    }
    .day-btn.active { background: #2E3B4E; color: #fff; }
    .day-btn.active.today::after { background: #e3c993; }

    .mobile-list {
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 4px 16px;
      box-shadow: var(--shadow-card);
    }
    [data-theme="dark"] .mobile-list { background: var(--cream); }
    .m-row {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .m-row:last-child { border-bottom: none; }
    .m-row.m-now { background: rgba(227,201,147,0.18); margin: 0 -16px; padding: 12px 16px; border-radius: 12px; border-bottom: none; }
    .m-row.m-now + .m-row { border-top: 1px solid var(--line); }
    .m-num { font-size: 10px; font-weight: 700; color: rgba(20,28,33,0.4); text-align: right; line-height: 1; }
    .m-num strong { display: block; font-size: 13px; color: var(--charcoal); font-family: ui-monospace,monospace; }
    .m-now .m-num strong { color: #b8943e; }
    .m-subject { font-size: 15px; font-weight: 600; color: #0e1417; line-height: 1.25; }
    .m-room { font-size: 12px; color: rgba(20,28,33,0.5); margin-top: 2px; }
    .m-empty { font-size: 14px; color: rgba(20,28,33,0.3); }
  }
</style>
</head>
<body>

<div data-site-header data-page="schedule"></div>

<section class="page-hero">
  <div class="wrap">
    <a class="crumb" href="/">
      <svg viewBox="0 0 12 12" fill="none"><path d="M7 3L4 6l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      На головну
    </a>
    <h1>Розклад <span class="brush">занять
      <svg viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
        <defs><filter id="rough3"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs>
        <path d="M8 50 Q 60 18, 140 32 T 280 38 T 392 30 L 388 60 Q 300 76, 200 66 T 60 70 T 12 64 Z" fill="#E3C993" opacity="0.85" filter="url(#rough3)"/>
      </svg>
    </span></h1>
    <p class="lede">Тижневий розклад уроків та хвилини дзвінків. Оберіть клас, щоб побачити свій розклад.</p>
  </div>
</section>

<section class="section" style="padding-top:24px">
  <div class="wrap" id="schedule-root">
    <div style="text-align:center;padding:80px 0;color:rgba(20,28,33,0.35);font-size:15px">Завантаження…</div>
  </div>
</section>

<section class="bells-section" id="bells-root">
</section>

<div data-site-footer></div>
<script src="site.js"></script>
<script>
(async function () {
  const schedRoot = document.getElementById('schedule-root');
  const bellsRoot = document.getElementById('bells-root');
  const DAYS = [
    { key: 'mon', short: 'Пн', long: 'Понеділок' },
    { key: 'tue', short: 'Вт', long: 'Вівторок' },
    { key: 'wed', short: 'Ср', long: 'Середа' },
    { key: 'thu', short: 'Чт', long: 'Четвер' },
    { key: 'fri', short: 'Пт', long: "П'ятниця" },
  ];
  const DAY_KEYS = [null,'mon','tue','wed','thu','fri',null]; // 0=Sun,6=Sat → null

  function toMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }

  function liveState(bells) {
    const now = new Date();
    const mins = now.getHours()*60 + now.getMinutes();
    const dayKey = DAY_KEYS[now.getDay()] || null;
    let lessonIdx = -1;   // index of lesson in progress
    let breakAfter = -1;  // index of bell whose break is now

    for (let i = 0; i < bells.length; i++) {
      const s = toMin(bells[i].start), e = toMin(bells[i].end);
      if (mins >= s && mins < e) { lessonIdx = i; break; }
      // break between bell i and i+1
      if (i < bells.length - 1) {
        const nextS = toMin(bells[i+1].start);
        if (mins >= e && mins < nextS) { breakAfter = i; break; }
      }
    }
    return { dayKey, lessonIdx, breakAfter };
  }

  function slotHTML(lesson, isNow) {
    if (!lesson || !lesson.subject) {
      return `<div class="slot empty${isNow ? ' slot--now' : ''}"><div class="s-name" style="color:rgba(20,28,33,0.4)">—</div></div>`;
    }
    const cls = (lesson.highlight ? 'slot gold' : 'slot') + (isNow ? ' slot--now' : '');
    return `<div class="${cls}">
      <div class="s-name">${lesson.subject}</div>
      ${lesson.room ? `<div class="s-room">${lesson.room}</div>` : ''}
    </div>`;
  }

  function renderGrid(cls, bells, state) {
    const { dayKey, lessonIdx } = state;
    const numLessons = bells.length;
    let html = `
      <div class="week-grid" role="table" aria-label="Розклад ${cls.name} на тиждень">
        <div class="corner"></div>
        ${DAYS.map(d => `<div class="day-head${dayKey === d.key ? ' day-head--today' : ''}">${d.short}<span class="dow">${d.long}</span></div>`).join('')}`;

    for (let i = 0; i < numLessons; i++) {
      const bell = bells[i];
      const isNowRow = i === lessonIdx;
      html += `<div class="time-cell${isNowRow ? ' time-cell--now' : ''}">${bell.num}<strong>${bell.start}</strong></div>`;
      DAYS.forEach(d => {
        const lessons = cls[d.key] || [];
        html += slotHTML(lessons[i], isNowRow && dayKey === d.key);
      });
    }
    html += `</div>`;
    return html;
  }

  function renderBells(bells, state) {
    const { lessonIdx, breakAfter } = state;
    let badge = '';
    if (lessonIdx >= 0) {
      badge = `<div class="live-badge"><span class="dot"></span>Зараз іде ${lessonIdx+1}-й урок · до ${bells[lessonIdx].end}</div>`;
    } else if (breakAfter >= 0) {
      const nextStart = bells[breakAfter+1].start;
      badge = `<div class="live-badge"><span class="dot"></span>Перерва · наступний урок о ${nextStart}</div>`;
    }
    return `
      <div class="wrap">
        <div class="bento-head">
          <h2>Розклад дзвінків</h2>
          <p>Графік уроків та перерв, який діє щодня.</p>
        </div>
        ${badge}
        <div class="bells standalone">
          <div class="bells-head">
            <span>№</span>
            <span></span>
            <span>Тривалість</span>
            <span class="lbl-break">Перерва</span>
          </div>
          ${bells.map((b, i) => {
            let cls = i % 2 !== 0 ? 'alt' : '';
            if (i === lessonIdx) cls = 'bell--now';
            else if (i === breakAfter) cls = 'bell--break';
            return `
            <div class="bell ${cls}">
              <div class="num">${b.num}</div>
              <div class="label">${b.num} урок</div>
              <div class="time">${b.start} — ${b.end}</div>
              <div class="brk${b.break === '—' ? ' none' : ''}">${b.break}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }

  try {
    const res = await fetch('/content/schedule.json');
    if (!res.ok) throw new Error();
    const data = await res.json();
    const { bells, classes } = data;

    if (!classes || !classes.length) {
      schedRoot.innerHTML = '<p style="text-align:center;padding:80px 0;color:rgba(20,28,33,0.4)">Розкладу ще немає</p>';
      return;
    }

    let activeIdx = 0;

    // Mobile day switcher state — default to today (or Monday on weekends)
    const todayDow = new Date().getDay();
    let mobileDayIdx = (todayDow >= 1 && todayDow <= 5) ? todayDow - 1 : 0;

    function renderMobileList(cls, bells, dayIdx, state) {
      const d = DAYS[dayIdx];
      const lessons = cls[d.key] || [];
      const { lessonIdx, dayKey } = state;
      const isToday = dayKey === d.key;
      return `<div class="mobile-list">` +
        bells.map((b, i) => {
          const lesson = lessons[i];
          const isNow = isToday && i === lessonIdx;
          if (!lesson || !lesson.subject) {
            return `<div class="m-row${isNow ? ' m-now' : ''}">
              <div class="m-num">${b.num}<strong>${b.start}</strong></div>
              <div class="m-empty">—</div>
            </div>`;
          }
          return `<div class="m-row${isNow ? ' m-now' : ''}">
            <div class="m-num">${b.num}<strong>${b.start}</strong></div>
            <div>
              <div class="m-subject">${lesson.subject}</div>
              ${lesson.room ? `<div class="m-room">${lesson.room}</div>` : ''}
            </div>
          </div>`;
        }).join('') + `</div>`;
    }

    function render() {
      const state = liveState(bells);
      const isMobile = window.innerWidth <= 640;
      const tabs = classes.map((c, i) =>
        `<button class="schedule-tab${i === activeIdx ? ' active' : ''}" data-idx="${i}">${c.name}</button>`
      ).join('');

      let gridOrDay = '';
      if (isMobile) {
        const { dayKey } = state;
        const daySwitcher = DAYS.map((d, i) => {
          const isToday = d.key === dayKey;
          return `<button class="day-btn${i === mobileDayIdx ? ' active' : ''}${isToday ? ' today' : ''}" data-day="${i}">${d.short}<br><small style="font-size:10px;font-weight:500">${d.long}</small></button>`;
        }).join('');
        gridOrDay = `<div class="day-switcher">${daySwitcher}</div>` +
          renderMobileList(classes[activeIdx], bells, mobileDayIdx, state);
      } else {
        gridOrDay = renderGrid(classes[activeIdx], bells, state);
      }

      schedRoot.innerHTML = `
        <div class="schedule-tabs" role="tablist" aria-label="Оберіть клас">${tabs}</div>
        ${gridOrDay}
        <p style="font-size:13px;color:rgba(20,28,33,0.5);margin-top:14px">Актуальний на поточний тиждень. Зміни — у оголошеннях адміністрації.</p>`;

      schedRoot.querySelectorAll('.schedule-tab').forEach(btn => {
        btn.addEventListener('click', () => { activeIdx = Number(btn.dataset.idx); render(); });
      });
      schedRoot.querySelectorAll('.day-btn').forEach(btn => {
        btn.addEventListener('click', () => { mobileDayIdx = Number(btn.dataset.day); render(); });
      });

      bellsRoot.innerHTML = renderBells(bells, state);
    }

    render();
    // Re-render every 30 seconds to keep highlight accurate
    setInterval(render, 30000);
    // Re-render on resize (desktop ↔ mobile switch)
    window.addEventListener('resize', render, { passive: true });
  } catch {
    schedRoot.innerHTML = '<p style="text-align:center;padding:80px 0;color:rgba(20,28,33,0.4)">Не вдалося завантажити розклад</p>';
  }
})();
</script>
</body>
</html>
